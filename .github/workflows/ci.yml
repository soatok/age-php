name: CI

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest]
        include:
          - php: '8.4'
            os: macos-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, gmp
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit tests/RoundTripTest.php

  cctv-vectors:
    name: CCTV test vectors (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, gmp
          coverage: none

      - name: Clone CCTV test vectors
        run: |
          git clone --depth 1 https://github.com/C2SP/CCTV.git /tmp/CCTV

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run CCTV test vectors
        env:
          CCTV_TESTDATA_DIR: /tmp/CCTV/age/testdata
        run: vendor/bin/phpunit tests/CCTVTestVectorTest.php

  interop:
    name: Interop with Go age ${{ matrix.age-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        age-version: ['v1.3.1']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          extensions: sodium, gmp
          coverage: none

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Install age ${{ matrix.age-version }}
        run: go install filippo.io/age/cmd/...@${{ matrix.age-version }}

      - name: Verify age is installed
        run: age --version

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run interop tests
        run: vendor/bin/phpunit tests/InteropTest.php
